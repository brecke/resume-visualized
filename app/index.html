<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Resume visualized</title>
        <link rel="stylesheet" href="./styles/main.css">
        <script type="module" src="./scripts/main.ts"></script>
    </head>
    <body>
        <main>
            <p id="legend">
                Percentages are exclusive shares of working time, not proficiency.
                White means a recorded 0%; full discipline color means 100%.
                Hatched cells marked “Unknown” have no recorded value.
            </p>
            <p id="scroll-help">On narrow screens, scroll the table horizontally to see every discipline.</p>
            <div class="matrix-scroll" tabindex="0" role="region" aria-labelledby="matrix-caption" aria-describedby="scroll-help">
                <table id="career-table" aria-describedby="legend">
                    <caption id="matrix-caption">Working-time shares</caption>
                </table>
            </div>
            <noscript>This matrix requires JavaScript to display its recorded allocations.</noscript>
        </main>
    </body>
</html>
